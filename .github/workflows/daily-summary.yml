name: Daily Horizon Summary

on:
  schedule:
    # 08:10 Asia/Shanghai. GitHub cron uses UTC.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Fetch content from the last N hours"
        required: true
        default: 24
        type: number

concurrency:
  group: daily-horizon-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HORIZON_HOURS: ${{ inputs.hours || 24 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.8.22"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate deployment configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          config_path = Path("data/config.json")
          if not config_path.exists():
              sys.exit("Missing data/config.json. Copy data/config.example.json and customize it before running Actions.")

          config = json.loads(config_path.read_text(encoding="utf-8"))
          required = [config["ai"]["api_key_env"]]
          sources = config.get("sources", {})

          twitter = sources.get("twitter") or {}
          if twitter.get("enabled"):
              required.append(twitter.get("apify_token_env", "APIFY_TOKEN"))

          email = config.get("email") or {}
          if email.get("enabled"):
              required.append(email.get("password_env", "EMAIL_PASSWORD"))

          webhook = config.get("webhook") or {}
          if webhook.get("enabled") and webhook.get("url_env"):
              required.append(webhook["url_env"])

          for feed in sources.get("rss", []):
              if feed.get("enabled", True):
                  required.extend(re.findall(r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}", feed.get("url", "")))

          required = list(dict.fromkeys(required))
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              sys.exit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          print("Configuration and required secrets look ready.")
          PY

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          GITHUB_TOKEN: ${{ secrets.HORIZON_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

        run: uv run --frozen horizon --hours "$HORIZON_HOURS"

      - name: Set current date as environment variable
        run: echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
